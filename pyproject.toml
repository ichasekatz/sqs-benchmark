[project]
name = "sqs-benchmark"
version = "0.1.0"
description = "Statistical benchmark comparing ATAT mcsqs, SCRAPS, and random assignment for SQS generation — demonstrated on BCC NbVW, adaptable to any BLADE-supported prototype"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Chase Katz", email = "ichasekatz@tamu.edu" },
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
]
dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pymatgen>=2025.1.1",
    "pycalphad>=0.11.1",
]

[project.urls]
Repository = "https://github.com/ichasekatz/sqs-benchmark"
Issues = "https://github.com/ichasekatz/sqs-benchmark/issues"

[dependency-groups]
dev = [
    "prek>=0.3.4",
    "ruff>=0.15.4",
    "ty>=0.0.20",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle Errors
    "ERA", # Eradicate
    "F",   # Pyflakes
    "FA",  # flake8-future-annotations
    "I",   # isort
    "ICN", # flake8-import-conventions
    "N",   # pep8-naming
    "PL",  # Pylint
    "PTH", # flake8-use-pathlib
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # pycodestyle Warnings
]
ignore = [
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "E402",    # Module level import not at top of file
    "E501",    # Line too long
    "ERA001",  # Eradicate: Commented-out code
    "N801",    # Class names should be in CamelCase
    "N802",    # Function names should be in snake_case
    "PLC0415", # `import` should be at the top-level of a file
    "B905",    # zip() without explicit strict= (benchmark scripts use matched-length iterables)
    "E731",    # Lambda assignment (used for short local key functions)
    "PLR0911", # Too many return statements in function
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "SIM105",  # Use contextlib.suppress (try/except/pass fine in parsing helpers)
]
pydocstyle.convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"
